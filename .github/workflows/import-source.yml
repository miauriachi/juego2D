name: Import RE Noche Cero source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-source.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download source zip
        run: |
          curl -fL "https://5a8e0e8c-77e9-4b8a-a830-ff3c7ad6bdce.sandbox.floot.app/_cdn/static/2bd93445-9be3-4fa4-949c-f968ad1477e2-REnochecero_PRERENDER_12_REPLIT_CLEAN.zip" -o /tmp/game.zip
          rm -rf /tmp/game
          mkdir -p /tmp/game
          unzip -q /tmp/game.zip -d /tmp/game

      - name: Copy source into repo
        run: |
          unzip -oq /tmp/game.zip -d . -x ".github/*"
          rm -rf backups artifacts node_modules

      - name: Commit source
        run: |
          git config user.name "ChatGPT Build"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Import PRERENDER_12 source [skip ci]"
          git push
