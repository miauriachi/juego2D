name: Validate game JavaScript

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**/*.js"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check changed game scripts
        run: |
          node --check src/game/Game.js
          node --check src/game/SceneNpcAnchors.js
          node --check src/game/UrgenciasSequence.js
          node --check src/game/RaccoonDeliverySequence.js
          node --check src/game/PrerenderBackdropManager.js
          node --check src/characters/LowPolyCharacter.js
